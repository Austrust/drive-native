[package]
name = "drive-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
[features]
native-research = ["sproto/protocol-research", "drive-core/native-research"]
[dependencies]
sha2 = "0.10"
drive-core = { path = "../drive-core", features = ["native"] }
drive-fs = { path = "../drive-fs" }
sproto = { path = "../sproto" }
fuser = { version = "=0.16.0", default-features = false, features = ["abi-7-31"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
nix = { version = "=0.29.0", features = ["socket", "uio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "=6.1.0", default-features = false, features = ["tokio", "proxy", "service"] }
[dev-dependencies]
rpassword = "7"

