[package]
name = "drive-fs"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[dependencies]
drive-core = { path = "../drive-core" }
fuser = { version = "=0.16.0", default-features = false, features = ["abi-7-31"] }
libc = "0.2"

[features]
# Test-only seams (deterministic late-reply injection). Never enabled in
# release/packaging builds.
test-seams = []

[dev-dependencies]
tempfile = "3"
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
drive-core = { path = "../drive-core", features = ["native"] }
