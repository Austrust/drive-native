[package]
name = "sproto"
license = "MIT"
edition = "2024"
version = "0.1.0"
readme = "README.md"
categories = ["network-programming"]
repository = "https://github.com/m1guelpf/sproto"
authors = ["Miguel Piedrafita <rust@miguel.build>"]
keywords = ["synology", "nas", "sync", "drive", "protocol"]
description = "Rust client for the Synology Drive sync protocol"

[features]
protocol-research = []

[[example]]
name = "native_roundtrip"
required-features = ["protocol-research"]

[[example]]
name = "native_recovery_roundtrip"
required-features = ["protocol-research"]

[dependencies]
bytes = "1"
macon = "1"
tracing = "0.1"
thiserror = "2"
tempfile = "3"
md4 = "0.10"
sha2 = "0.10"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
rpassword = "7"
serde_json = "1"
anyhow = "1"
indicatif = "0.18"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.39", features = ["bundled"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.clippy]
missing_errors_doc = "allow"
multiple_crate_versions = "allow"
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }


[[example]]
name = "native_create_contract"
required-features = ["protocol-research"]

[[example]]
name = "native_namespace_contract"
required-features = ["protocol-research"]

[[example]]
name = "native_download_reuse"
required-features = ["protocol-research"]
