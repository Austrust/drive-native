[package]
name = "drive-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[features]
native = ["dep:sproto"]
native-research = ["native", "sproto/protocol-research"]

[[example]]
name = "native_state_roundtrip"
required-features = ["native-research"]

[dependencies]
md4 = "0.10"
tokio = { version = "1", features = ["rt"] }
libc = "0.2"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
sproto = { path = "../sproto", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
rpassword = "7"
